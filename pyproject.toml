[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-face-mask-detection"
version = "1.0.0"
description = "Real-time face-mask detection with an OpenCV DNN YOLO model"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5",
]

[project.scripts]
face-mask-detection = "mask_detection:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
